\r
## Common patterns\r
\r
### Scene transition via portal\r
```ron\r
// state_machine.ron\r
( on: "entity.entered:portal_to_arena", do_actions: [ LoadScene("scenes/arena.scene.ron") ] ),\r
```\r
\r
### NPC kill → reward\r
```ron\r
// state_machine.ron global_on\r
( event: "stat.drone_01.health.depleted", do_actions: [\r
    IncrementVariable("score", 10),\r
    SpawnEffect(key: "explosion", entity: "drone_01"),\r
    PlaySound(key: "explosion_sfx"),\r
    Despawn("drone_01"),\r
]),\r
```\r
\r
### Respawn dummy (hide + delay + restore)\r
Use behavior FSM with `idle` → `dead` transition on health.depleted, then `dead` → `idle` on delayed respawn. Prefer this over Despawn + Spawn — preserves spawn ID, stat map, and position.\r
\r
### Pause menu\r
```ron\r
transitions: [\r
    ( from: Some("playing"), on: "ui.button_pressed:toggle_pause", to: "paused" ),\r
    ( from: Some("paused"),  on: "ui.button_pressed:toggle_pause", to: "playing" ),\r
]\r
states: [\r
    ( name: "paused", entry_actions: [ LoadSceneOverlay("scenes/pause.scene.ron") ], exit_actions: [ UnloadOverlay ], on: [] ),\r
]\r
```\r
\r
### Audio mute button wiring\r
```ron\r
// state_machine.ron global_on\r
( event: "ui.button_pressed:toggle_mute", do_actions: [ ToggleMute ] ),\r
( event: "audio.muted",   do_actions: [ SetVariable("audio_muted", "true") ] ),\r
( event: "audio.unmuted", do_actions: [ SetVariable("audio_muted", "false") ] ),\r
// In scene UI: IconButton with bind: "audio_muted"\r
```\r
\r
---\r
\r
## Critical rules\r
\r
- `EmitEventAfterDelay` events are cleared on `LoadScene` — delayed events do NOT survive scene transitions.\r
- Stat threshold events fire on the **next frame** after `ModifyStat`/`SetStat`.\r
- `action_bar.activated:<key>` fires one frame after the slot's `do_actions` (do not use for immediate same-frame chaining).\r
- `from: Some("state_name")` to target a specific source state; omit `from` entirely (not `from: None`) to match any state in a transition.\r
- Behavior files are shared across instances — `{self}` is the only instance-differentiation mechanism.\r
- `stat_templates` thresholds are the only way to emit events from stat changes — there is no `watch_stat` event."""
