## `scenes/*.scene.ron` — GameSceneV2 schema_version: 2\r
\r
```ron\r
(\r
    schema_version: 2,\r
    name: "main",\r
\r
    lighting: (\r
        ambient: (0.22, 0.25, 0.32),\r
        ambient_brightness: 200.0,\r
        directional: (\r
            color: (1.0, 0.95, 0.85),\r
            intensity: 30000.0,\r
            rotation_euler_deg: (-50.0, 25.0, 0.0),\r
            shadows_enabled: true,\r
            shadow_distance: 200.0,\r
            cascade_overlap: 0.5,\r
        ),\r
        point_lights: [\r
            ( position: (0.0, 3.0, 0.0), color: (0.5, 0.7, 1.0), intensity: 20000.0, range: 15.0 ),\r
        ],\r
    ),\r
\r
    spawn_points: {\r
        "player_start": (0.0, 1.0, 0.0),\r
    },\r
\r
    label_depth_scale: (\r
        reference_distance: 12.0,\r
        min_scale: 0.2,\r
    ),\r
\r
    entities: [\r
        (\r
            id: "cam",\r
            prefab: "flycam",\r
            // yaw 180 because content below sits at z=0, HIGHER than the camera's\r
            // z=-8 -- yaw 0 would face -Z, away from it (see Universal rules above).\r
            transform: ( translation: (0.0, 5.0, -8.0), rotation_euler_deg: (0.0, 180.0, 0.0), scale: (1.0, 1.0, 1.0) ),\r
        ),\r
        (\r
            id: "alien_01",\r
            prefab: "alien_cyclop",\r
            transform: ( translation: (3.0, 1.0821, 0.0) ),\r
            label: ( text: "Alien_Cyclop" ),\r
        ),\r
    ],\r
\r
    ui: [\r
        Label((\r
            id: "hint",\r
            text: "WASD = fly | Shift = fast | Hold LMB/RMB + mouse = look",\r
            position: (16.0, 16.0),\r
            size: (600.0, 24.0),\r
        )),\r
        Button((\r
            id: "start",\r
            text: "Start",\r
            action: "ui.start",\r
            position: (20.0, 60.0),\r
            size: (150.0, 40.0),\r
        )),\r
    ],\r
)\r
```\r
\r
UI node types: `Button`, `Label`, `Rect`, `StatBar`, `StatSpread`, `ActionBar`, `DialoguePanel`, `InventoryPanel`, `ShopPanel`, `ContainerPanel`, `IconButton`.\r
\r
---\r
\r
## `logic/state_machine.ron` — StateMachineAsset schema_version: 1\r
\r
```ron\r
(\r
    schema_version: 1,\r
    initial_state: "menu",\r
\r
    global_on: [\r
        ( event: "ui.button_pressed:debug_reload", do_actions: [ Log("reload") ] ),\r
    ],\r
\r
    states: [\r
        (\r
            name: "playing",\r
            entry_actions: [ PlayMusicLoop(key: "bg_music") ],\r
            exit_actions: [ StopMusic ],\r
            on: [\r
                ( event: "ui.button_pressed:dance", do_actions: [ PlayAnimation("dance") ] ),\r
            ],\r
        ),\r
    ],\r
\r
    transitions: [\r
        ( on: "scene.ready:main", to: "playing" ),\r
        ( from: Some("playing"), on: "ui.button_pressed:toggle_pause", to: "paused" ),\r
    ],\r
)\r
```\r
\r
Execution order on transition: exit actions → state change → entry actions.\r
Do NOT write `EnterState` in FSM transition data — the engine handles it.\r
\r
Scene lifecycle event order: `scene.requested:<stem>` → `scene.loaded:<stem>` → `scene.ready:<stem>`\r
\r
---\r
\r
## `behaviors/*.behavior.ron` — entity FSM\r
\r
Same format as `state_machine.ron`. `{self}` is substituted with the entity's spawn ID at runtime.\r
\r
```ron\r
(\r
    schema_version: 1,\r
    initial_state: "idle",\r
    global_on: [],\r
    states: [\r
        ( name: "idle",      entry_actions: [], exit_actions: [], on: [] ),\r
        ( name: "collected", entry_actions: [ PlaySound(key: "score"), Despawn("{self}") ], exit_actions: [], on: [] ),\r
    ],\r
    transitions: [\r
        ( from: Some("idle"), on: "entity.interacted:{self}", to: "collected" ),\r
    ],\r
)\r
```\r
\r
`{self}` works in: transition `on` patterns, event patterns, and action fields: `Despawn`, `PlayAnimationOn.target`, `EmitEvent`, `ModifyStat.key`, `SetStat.key`, `ShowDamagePopup.entity`, `SetEntityVisible.entity`, `EmitEventAfterDelay.event`, `Spawn.id`.\r
\r
---\r
\r
## Common actions reference\r
\r
| Action | Syntax |\r
|--------|--------|\r
| Load scene | `LoadScene("scenes/main.scene.ron")` |\r
| Spawn | `Spawn( prefab: "key", id: "my_id", position: (0.0, 0.0, 0.0) )` |\r
| Despawn | `Despawn("my_id")` |\r
| Play sound | `PlaySound(key: "click")` |\r
| Music | `PlayMusicLoop(key: "bg_music")` / `StopMusic` |\r
| State | `EnterState("playing")` |\r
| Variable | `SetVariable("score", "0")` / `IncrementVariable("score", 1)` |\r
| Stat | `ModifyStat(key: "player_health", delta: -25.0)` / `SetStat(key: "{self}.health", value: 100.0)` |\r
| Effect | `SpawnEffect(key: "hit_spark", entity: "enemy_01")` |\r
| Preload | `PreloadPrefab("drone")` / `PreloadScene("scenes/arena.scene.ron")` |\r
| Hide entity | `SetEntityVisible(entity: "{self}", visible: false)` |\r
| Delayed event | `EmitEventAfterDelay(event: "entity.respawned:{self}", delay_secs: 15.0)` |\r
| Damage popup | `ShowDamagePopup(entity: "{self}", amount: -25.0)` |\r
| Overlay | `LoadSceneOverlay("scenes/pause.scene.ron")` / `UnloadOverlay` |\r
\r
## WASM-specific patterns (always apply)\r
\r
- On `scene.ready:<name>`: fire `SpawnEffect` warmup burst at `position: Some((0.0, -100.0, 0.0))` for each distinct particle variant (sphere, flame shader) to pre-compile WebGPU pipelines.\r
- On `scene.ready:<name>`: fire `PreloadPrefab` for any prefab that may be dynamically spawned later to prevent GLB-decode stalls.\r
- On `scene.ready:<name>`: fire `PreloadScene` for the next scene the player might enter.\r
- Dynamic point lights: cap at 16 simultaneous fading lights per scene.\r
- Spawns are frame-paced (max 2/frame) — do not expect immediate spawn of many entities."""
